name: tests

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  JOLT_CORE_SHA: 46e1f74fc14f29283586900ef4b98c45375c0500

jobs:
  jvm-codec:
    name: JVM byte-codec compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Run JVM codec compatibility suite
        run: clojure -Srepro -M:jvm-bencode-test

  posix-runtime:
    name: Jolt nREPL runtime and Hegel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
          - name: macOS arm64
            runner: macos-14
          - name: macOS x86_64
            runner: macos-15-intel
    env:
      JOLT_AOT_CACHE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install source-build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git liblz4-dev zlib1g-dev \
            libncurses-dev uuid-dev libssl-dev

      - name: Install source-build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lz4 openssl@3

      - name: Restore Chez Scheme (Linux)
        if: runner.os == 'Linux'
        id: cache-chez-linux
        uses: actions/cache/restore@v4
        with:
          path: ~/chez
          key: chez-${{ runner.os }}-${{ runner.arch }}-v10.4.1-x11off-v1

      - name: Build official Chez Scheme v10.4.1 from source (Linux)
        if: runner.os == 'Linux' && steps.cache-chez-linux.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v10.4.1 \
            https://github.com/cisco/ChezScheme.git "$RUNNER_TEMP/chez-src"
          cd "$RUNNER_TEMP/chez-src"
          ./configure --installprefix="$HOME/chez" --threads --disable-x11
          make -j"$(nproc)"
          make install

      - name: Restore Chez Scheme (macOS)
        if: runner.os == 'macOS'
        id: cache-chez-macos
        uses: actions/cache/restore@v4
        with:
          path: ~/chez
          key: chez-${{ runner.os }}-${{ runner.arch }}-v10.4.1-x11off-v1

      - name: Build official Chez Scheme v10.4.1 from source (macOS)
        if: runner.os == 'macOS' && steps.cache-chez-macos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v10.4.1 \
            https://github.com/cisco/ChezScheme.git "$RUNNER_TEMP/chez-src"
          cd "$RUNNER_TEMP/chez-src"
          ./configure --installprefix="$HOME/chez" --threads --disable-x11
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Provide and assert official Chez v10.4.1
        shell: bash
        run: |
          set -euo pipefail
          bindir="$HOME/chez/bin"
          test -x "$bindir/scheme"
          printf '#!/bin/sh\nexec %s "$@"\n' "$bindir/scheme" > "$bindir/chez"
          chmod +x "$bindir/chez"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/chez" --version | tee /tmp/chez-version
          grep -Fq '10.4.1' /tmp/chez-version

      - name: Save Chez Scheme (Linux)
        if: runner.os == 'Linux' && steps.cache-chez-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/chez
          key: ${{ steps.cache-chez-linux.outputs.cache-primary-key }}

      - name: Save Chez Scheme (macOS)
        if: runner.os == 'macOS' && steps.cache-chez-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/chez
          key: ${{ steps.cache-chez-macos.outputs.cache-primary-key }}

      - name: Checkout pinned Jolt fork
        uses: actions/checkout@v4
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          path: jolt

      - name: Restore built libhegel (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        id: cache-libhegel-macos
        uses: actions/cache/restore@v4
        with:
          path: hegel-build
          key: libhegel-macOS-X64-0.30.1-f81c6cce-rust1.86.0-v1

      - name: Checkout pinned libhegel source (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.cache-libhegel-macos.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: hegeldev/hegel-rust
          ref: f81c6cceabe3c6695a249588c751a5ce93dffa00
          persist-credentials: false
          path: hegel-rust

      - name: Build pinned libhegel 0.30.1 (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.cache-libhegel-macos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd hegel-rust
          rustup toolchain install 1.86.0 --profile minimal
          cargo +1.86.0 build --locked -p hegeltest-c --release
          test -f target/release/libhegel_c.dylib
          mkdir -p "$GITHUB_WORKSPACE/hegel-build"
          cp target/release/libhegel_c.dylib "$GITHUB_WORKSPACE/hegel-build/"

      - name: Save built libhegel (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.cache-libhegel-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: hegel-build
          key: ${{ steps.cache-libhegel-macos.outputs.cache-primary-key }}

      - name: Publish libhegel path (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        shell: bash
        run: |
          set -euo pipefail
          library="$GITHUB_WORKSPACE/hegel-build/libhegel_c.dylib"
          test -f "$library"
          echo "HEGEL_LIBHEGEL_LIBRARY=$library" >> "$GITHUB_ENV"

      - name: Run complete nREPL client/server suite
        shell: bash
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" \
            -M:test

      - name: Install libhegel
        shell: bash
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" \
            -A:hegel -m hegel.install

      - name: Run Hegel transport properties
        shell: bash
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" \
            -M:hegel

  windows-x64-runtime:
    name: Jolt nREPL runtime and Hegel (Windows x86_64)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    env:
      JOLT_AOT_CACHE: "0"
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 source-build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            git make mingw-w64-x86_64-gcc mingw-w64-x86_64-lz4
            mingw-w64-x86_64-zlib

      - name: Restore Chez Scheme
        id: cache-chez-windows
        uses: actions/cache/restore@v4
        with:
          path: chez-install
          key: chez-${{ runner.os }}-${{ runner.arch }}-v10.4.1-mingw64-v1

      - name: Build official Chez Scheme v10.4.1 from source
        if: steps.cache-chez-windows.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v10.4.1 \
            https://github.com/cisco/ChezScheme.git "$RUNNER_TEMP/chez-src"
          cd "$RUNNER_TEMP/chez-src"
          ./configure --threads
          make -j"$(nproc)"
          inst="$GITHUB_WORKSPACE/chez-install"
          mkdir -p "$inst/bin" "$inst/csv"
          cp ta6nt/bin/ta6nt/*.exe "$inst/bin/"
          cp ta6nt/bin/ta6nt/*.dll "$inst/bin/" 2>/dev/null || true
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/bin/"
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/csv/"
          cp ta6nt/boot/ta6nt/scheme.h "$inst/csv/"
          cp ta6nt/boot/ta6nt/libkernel.a "$inst/csv/"

      - name: Assert official Chez v10.4.1
        run: |
          set -euo pipefail
          bindir="$GITHUB_WORKSPACE/chez-install/bin"
          test -x "$bindir/scheme.exe"
          "$bindir/scheme.exe" --version | tee "$RUNNER_TEMP/chez-version"
          grep -Fq '10.4.1' "$RUNNER_TEMP/chez-version"

      - name: Save Chez Scheme
        if: steps.cache-chez-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: chez-install
          key: ${{ steps.cache-chez-windows.outputs.cache-primary-key }}

      - name: Checkout pinned Jolt fork
        uses: actions/checkout@v4
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          path: jolt

      # This runs first and has no jolt-hegel dependency. The real Windows
      # loopback server/client gate cannot disappear behind an installer issue.
      - name: Run complete nREPL client/server suite
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:GITHUB_WORKSPACE\chez-install\bin\scheme.exe" `
            -TestAlias '-M:test' `
            -TimeoutSeconds 1200

      - name: Install libhegel and run transport properties
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:GITHUB_WORKSPACE\chez-install\bin\scheme.exe" `
            -TestAlias '-M:hegel' `
            -InstallHegel `
            -TimeoutSeconds 1200

  windows-arm64-runtime:
    name: Jolt nREPL runtime and Hegel (Windows aarch64)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    env:
      JOLT_AOT_CACHE: "0"
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
    steps:
      - uses: actions/checkout@v4

      - name: Assert the runner is ARM64
        shell: pwsh
        run: |
          Write-Host "runner.arch      = ${{ runner.arch }}"
          Write-Host "PROCESSOR_ARCH   = $env:PROCESSOR_ARCHITECTURE"
          Write-Host "OS architecture  = $((Get-CimInstance Win32_OperatingSystem).OSArchitecture)"
          if ('${{ runner.arch }}' -ne 'ARM64') {
            throw "expected an ARM64 runner, got '${{ runner.arch }}'"
          }

      - name: Restore native ARM64 Chez Scheme
        id: cache-chez-arm64
        uses: actions/cache/restore@v4
        with:
          path: chez-arm64/tarm64nt
          key: chez-${{ runner.os }}-${{ runner.arch }}-v10.4.1-tarm64nt-v1

      - name: Checkout official Chez Scheme v10.4.1
        if: steps.cache-chez-arm64.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: cisco/ChezScheme
          ref: v10.4.1
          submodules: recursive
          persist-credentials: false
          path: chez-arm64

      - name: Build native ARM64 Chez Scheme from source
        if: steps.cache-chez-arm64.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\chez-arm64"
          call build.bat tarm64nt /only

      - name: Checkout pinned Jolt fork
        uses: actions/checkout@v4
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          path: jolt

      - name: Assert native Chez v10.4.1
        shell: pwsh
        run: |
          $scheme = Join-Path $env:GITHUB_WORKSPACE `
            'chez-arm64\tarm64nt\bin\tarm64nt\scheme.exe'
          if (-not (Test-Path $scheme)) {
            throw "native ARM64 Chez executable not found: $scheme"
          }
          $version = (& $scheme --version | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $version
          if (-not $version.Contains('10.4.1')) {
            throw "expected Chez Scheme 10.4.1, got: $version"
          }
          $probe = Join-Path $env:RUNNER_TEMP 'machine-type.ss'
          Set-Content -Path $probe -Value '(display (machine-type))(newline)'
          $machine = (& $scheme --script $probe | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "scheme.exe --script exited $LASTEXITCODE"
          }
          Write-Host "chez machine-type: $machine"
          if ($machine -ne 'tarm64nt') {
            throw "expected Chez machine-type tarm64nt, got '$machine'"
          }

      - name: Save native ARM64 Chez Scheme
        if: steps.cache-chez-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: chez-arm64/tarm64nt
          key: ${{ steps.cache-chez-arm64.outputs.cache-primary-key }}

      # This runs first and has no jolt-hegel dependency. The real ARM64
      # loopback client/server gate cannot disappear behind an installer issue.
      - name: Run complete nREPL client/server suite
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:GITHUB_WORKSPACE\chez-arm64\tarm64nt\bin\tarm64nt\scheme.exe" `
            -ExpectedArch 'aarch64' `
            -TestAlias '-M:test' `
            -TimeoutSeconds 1200

      - name: Install libhegel and run transport properties
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:GITHUB_WORKSPACE\chez-arm64\tarm64nt\bin\tarm64nt\scheme.exe" `
            -ExpectedArch 'aarch64' `
            -TestAlias '-M:hegel' `
            -InstallHegel `
            -TimeoutSeconds 1200
